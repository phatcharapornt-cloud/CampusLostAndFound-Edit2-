<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าหลัก | Campus Lost & Found Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin-layout.css">

    <style>
        /* ---------- ส่วนหัว: ทักทาย + ปุ่มรีเฟรช ---------- */
        .hero {
            background: linear-gradient(120deg, #ffffff 0%, #fff6f1 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px 26px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .hero h2 {
            font-size: 21px;
            font-weight: 600;
            margin-bottom: 4px;
            word-break: break-all;
        }
        .hero p {
            font-size: 13.5px;
            color: var(--text-muted);
        }
        .refresh-box {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12.5px;
            color: var(--text-muted);
        }
        .refresh-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: 1px solid var(--border);
            background-color: var(--surface);
            color: var(--text);
            font-size: 13px;
            padding: 7px 13px;
            border-radius: 10px;
            cursor: pointer;
        }
        .refresh-btn:hover { border-color: var(--primary); color: var(--primary); }
        .refresh-btn:disabled { opacity: 0.6; cursor: wait; }

        .section-head {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .section-head h2 {
            font-size: 16px;
            font-weight: 600;
        }
        .section-head p {
            font-size: 12.5px;
            color: var(--text-muted);
        }

        /* ---------- งานที่รอดำเนินการ (การ์ด 1-4) ---------- */
        .task-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }
        .task-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .task-card.has-pending { border-color: #f8c9b0; box-shadow: 0 6px 20px rgba(242, 101, 34, 0.08); }
        .task-head {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .task-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background-color: var(--primary-soft);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .task-head h3 {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.35;
        }
        .task-count {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .task-count strong {
            font-size: 38px;
            font-weight: 650;
            line-height: 1;
            color: var(--text);
        }
        .task-card.has-pending .task-count strong { color: var(--primary); }
        .task-count span {
            font-size: 13px;
            color: var(--text-muted);
        }
        .task-status {
            font-size: 12.5px;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .task-status[hidden] { display: none; }
        .task-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.55;
            flex: 1;
        }
        .task-extra {
            font-size: 12.5px;
            color: var(--text);
            background-color: var(--bg);
            border-radius: 8px;
            padding: 7px 10px;
        }
        .task-note {
            font-size: 12px;
            color: #b45309;
            display: flex;
            gap: 6px;
            line-height: 1.5;
        }
        .task-note i { margin-top: 3px; }
        .task-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background-color: var(--surface);
            color: var(--text);
            font-size: 13.5px;
            font-weight: 500;
            text-decoration: none;
        }
        a.task-action:hover { border-color: var(--primary); color: var(--primary); }
        .task-action.is-primary {
            background-color: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }
        a.task-action.is-primary:hover { background-color: var(--primary-hover); color: #ffffff; }
        .task-action.is-disabled {
            opacity: 0.6;
            cursor: not-allowed;
            flex-wrap: wrap;
        }
        .task-action .nowrap { white-space: nowrap; }
        .soon-tag {
            font-size: 10.5px;
            font-weight: 500;
            padding: 1px 8px;
            border-radius: 999px;
            background-color: rgba(17, 24, 39, 0.08);
            white-space: nowrap;
        }
        .task-action.is-primary .soon-tag { background-color: rgba(255, 255, 255, 0.25); }

        /* ---------- History (5.1-5.4) ---------- */
        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
        }
        .history-tile {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: inherit;
        }
        a.history-tile:hover { border-color: var(--primary); }
        .history-tile.is-disabled { cursor: not-allowed; }
        .history-tile .tile-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background-color: #eef2f7;
            color: var(--navy-light);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .history-tile .tile-text { flex: 1; min-width: 0; }
        .history-tile .tile-label {
            font-size: 13.5px;
            font-weight: 500;
            line-height: 1.35;
        }
        .history-tile .tile-total {
            font-size: 12.5px;
            color: var(--text-muted);
        }
        .history-tile .tile-total strong {
            font-size: 15px;
            color: var(--text);
            font-weight: 600;
        }
        .history-tile .tile-go { color: #9ca3af; font-size: 13px; }
        .history-tile .soon-tag {
            display: inline-block;
            margin-top: 4px;
            color: var(--text-muted);
            background-color: var(--bg);
        }

        @media (max-width: 640px) {
            .hero { padding: 18px; }
            .task-count strong { font-size: 32px; }
        }
    </style>
</head>

<body class="is-checking">
    <div class="admin-app">
        <aside class="admin-sidebar" id="admin-sidebar"></aside>

        <div class="admin-main">
            <header class="admin-topbar" id="admin-topbar"></header>

            <main class="admin-content">
                <div class="page-alert" id="page-alert" role="alert">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="page-alert-text"></span>
                </div>

                <section class="hero">
                    <div>
                        <h2>สวัสดี <span id="hello-email"></span></h2>
                        <p><span id="today"></span> · เซสชันหมดอายุเวลา <span id="session-expiry"></span> น.</p>
                    </div>
                    <div class="refresh-box">
                        <span id="updated-at" aria-live="polite">กำลังโหลดข้อมูล...</span>
                        <button type="button" class="refresh-btn" id="refresh-btn">
                            <i class="fa-solid fa-rotate-right"></i>รีเฟรช
                        </button>
                    </div>
                </section>

                <section aria-labelledby="tasks-title">
                    <div class="section-head">
                        <h2 id="tasks-title">งานที่รอดำเนินการ</h2>
                        <p>ตัวเลขอัปเดตอัตโนมัติทุก 1 นาที</p>
                    </div>
                    <div class="task-grid" id="task-grid"></div>
                </section>

                <section aria-labelledby="history-title">
                    <div class="section-head">
                        <h2 id="history-title">History</h2>
                        <p>รายการทั้งหมดในระบบ ย้อนหลังทุกสถานะ</p>
                    </div>
                    <div class="history-grid" id="history-grid"></div>
                </section>
            </main>
        </div>
    </div>
    <div class="admin-backdrop" id="admin-backdrop"></div>

    <script src="admin-session.js"></script>
    <script src="admin-layout.js"></script>
    <script>
        const REFRESH_EVERY_MS = 60 * 1000;   // รีเฟรชตัวเลขอัตโนมัติทุก 1 นาที

        // การ์ดงานที่รอดำเนินการ (1-3) — countKey คือชื่อค่าใน pending ที่ได้จาก /api/admin/summary
        const TASKS = [
            {
                page: 'approve-found', countKey: 'found', unit: 'รายการรออนุมัติ',
                desc: 'สิ่งของที่ผู้ใช้แจ้งพบ ตรวจสอบและอนุมัติเมื่อได้รับสิ่งของที่ศูนย์แล้ว',
                note: 'รายการที่ไม่ได้อนุมัติภายใน 30 นาที ระบบจะลบอัตโนมัติ',
                action: 'ไปที่หน้าอนุมัติ',
            },
            {
                page: 'matches', countKey: 'matches', unit: 'คู่รอตรวจสอบ',
                desc: 'คู่สิ่งของที่หายกับที่พบซึ่งระบบจับคู่ได้ (คะแนนมากกว่า 70%) ตรวจก่อนแจ้งไปยังเจ้าของ',
                action: 'ตรวจสอบการจับคู่',
            },
            {
                page: 'claims', countKey: 'claims', unit: 'คำขอรออนุมัติ',
                desc: 'คำขอรับสิ่งของคืนจากเจ้าของ อนุมัติหรือปฏิเสธ และยืนยันเมื่อคืนสิ่งของแล้ว',
                extra: (pending) => `อนุมัติแล้ว รอเจ้าของมารับ <strong>${pending.awaitingReturn}</strong> รายการ`,
                action: 'ไปที่คำขอรับคืน',
            },
        ];

        // History (5.1-5.4) — totalKey คือชื่อค่าใน totals
        const HISTORY = [
            { page: 'history-lost',    totalKey: 'lost' },
            { page: 'history-found',   totalKey: 'found' },
            { page: 'history-matches', totalKey: 'matches' },
            { page: 'history-claims',  totalKey: 'claims' },
        ];

        const esc = AdminLayout.escapeHtml;
        const session = AdminLayout.init('home');

        // ปุ่มไปหน้าต่าง ๆ: หน้าที่สร้างแล้วเป็นลิงก์ (มีลูกศร), หน้าที่ยังไม่สร้างกดไม่ได้และมีป้าย "เร็ว ๆ นี้"
        function actionHtml(pageInfo, label, primary = false, icon = '') {
            const cls = `task-action${primary ? ' is-primary' : ''}`;
            const text = `${icon}<span class="nowrap">${label}</span>`;
            if (pageInfo.ready) return `<a class="${cls}" href="${pageInfo.href}">${text}${icon ? '' : ' <i class="fa-solid fa-arrow-right"></i>'}</a>`;
            return `<span class="${cls} is-disabled" aria-disabled="true" title="หน้านี้ยังไม่ได้สร้าง">${text}<span class="soon-tag">เร็ว ๆ นี้</span></span>`;
        }

        function renderCards() {
            const taskCards = TASKS.map((task) => {
                const page = AdminLayout.getPage(task.page);
                return `
                    <article class="task-card" id="card-${task.page}">
                        <div class="task-head">
                            <div class="task-icon"><i class="${page.icon}"></i></div>
                            <h3>${esc(page.label)}</h3>
                        </div>
                        <div class="task-count"><strong data-count="${task.countKey}">–</strong><span>${task.unit}</span></div>
                        <div class="task-status" data-status="${task.countKey}" hidden><i class="fa-solid fa-circle-check"></i>ไม่มีรายการค้าง</div>
                        <p class="task-desc">${task.desc}</p>
                        ${task.extra ? `<div class="task-extra" data-extra="${task.page}">–</div>` : ''}
                        ${task.note ? `<div class="task-note"><i class="fa-solid fa-triangle-exclamation"></i><span>${task.note}</span></div>` : ''}
                        ${actionHtml(page, task.action)}
                    </article>`;
            });

            // การ์ดที่ 4: บันทึกรายการสิ่งของที่พบ (เป็นปุ่มทำรายการ ไม่มีตัวเลข)
            const recordPage = AdminLayout.getPage('record-found');
            taskCards.push(`
                <article class="task-card">
                    <div class="task-head">
                        <div class="task-icon"><i class="${recordPage.icon}"></i></div>
                        <h3>${esc(recordPage.label)}</h3>
                    </div>
                    <p class="task-desc">บันทึกสิ่งของที่มีผู้นำมาส่งที่ศูนย์โดยตรง ระบบจะอนุมัติทันทีและเริ่มจับคู่กับรายการของหายให้อัตโนมัติ</p>
                    ${actionHtml(recordPage, 'บันทึกรายการใหม่', true, '<i class="fa-solid fa-plus"></i>')}
                </article>`);
            document.getElementById('task-grid').innerHTML = taskCards.join('');

            document.getElementById('history-grid').innerHTML = HISTORY.map((item) => {
                const page = AdminLayout.getPage(item.page);
                const inner = `
                    <div class="tile-icon"><i class="${page.icon}"></i></div>
                    <div class="tile-text">
                        <div class="tile-label">${esc(page.label)}</div>
                        <div class="tile-total">ทั้งหมด <strong data-total="${item.totalKey}">–</strong> รายการ</div>
                        ${page.ready ? '' : '<span class="soon-tag">เร็ว ๆ นี้</span>'}
                    </div>
                    ${page.ready ? '<i class="fa-solid fa-chevron-right tile-go"></i>' : ''}`;
                return page.ready
                    ? `<a class="history-tile" href="${page.href}">${inner}</a>`
                    : `<div class="history-tile is-disabled" title="หน้านี้ยังไม่ได้สร้าง">${inner}</div>`;
            }).join('');
        }

        function showPageAlert(message) {
            document.getElementById('page-alert-text').textContent = message || '';
            document.getElementById('page-alert').classList.toggle('is-visible', Boolean(message));
        }

        function renderSummary(data) {
            const { pending, totals } = data;
            for (const task of TASKS) {
                const count = pending[task.countKey];
                document.querySelector(`[data-count="${task.countKey}"]`).textContent = count;
                document.querySelector(`[data-status="${task.countKey}"]`).hidden = count > 0;
                document.getElementById(`card-${task.page}`).classList.toggle('has-pending', count > 0);
                if (task.extra) document.querySelector(`[data-extra="${task.page}"]`).innerHTML = task.extra(pending);
                AdminLayout.setBadge(task.page, count);   // ตัวเลขบนเมนูซ้าย
            }
            for (const item of HISTORY) {
                document.querySelector(`[data-total="${item.totalKey}"]`).textContent = totals[item.totalKey].toLocaleString('th-TH');
            }
            const time = new Date(data.generatedAt).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('updated-at').textContent = `อัปเดตล่าสุด ${time} น.`;
        }

        let loading = false;
        async function loadSummary() {
            if (loading) return;
            loading = true;
            const refreshBtn = document.getElementById('refresh-btn');
            refreshBtn.disabled = true;
            try {
                const { ok, data } = await AdminSession.apiFetch('/api/admin/summary');
                if (ok && data.success) {
                    renderSummary(data);
                    showPageAlert('');
                } else {
                    showPageAlert(data.message || 'ไม่สามารถโหลดข้อมูลสรุปได้');
                }
            } catch (error) {
                if (!error.unauthorized) {
                    showPageAlert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาตรวจสอบว่าเปิด Backend แล้ว');
                    document.getElementById('updated-at').textContent = 'โหลดข้อมูลไม่สำเร็จ';
                }
            } finally {
                loading = false;
                refreshBtn.disabled = false;
            }
        }

        if (session) {
            document.getElementById('hello-email').textContent = session.admin?.Admin_email || '';
            document.getElementById('today').textContent = new Date().toLocaleDateString('th-TH', {
                weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
            });
            document.getElementById('session-expiry').textContent = new Date(session.expiresAt * 1000)
                .toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
            renderCards();
            loadSummary();

            document.getElementById('refresh-btn').addEventListener('click', loadSummary);
            setInterval(() => { if (!document.hidden) loadSummary(); }, REFRESH_EVERY_MS);
            document.addEventListener('visibilitychange', () => { if (!document.hidden) loadSummary(); });
        }
    </script>
</body>
</html>
