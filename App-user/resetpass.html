<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lost & Found</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" 
            rel="stylesheet"> 

<style>
    /* เซ็ตระยะขอบเดิมและการตั้งพื้นฐาน */
    *{
        margin: 0;                  /*ลบระยะห่างภายนอก*/
        padding: 0;                  /* ลบกระยะห่างภายใน */
        box-sizing: border-box;
        font-family: 'Prompt', sans-serif;
    }
    body {
        background-color: #f4f5f8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .reset-container {
        width: 100%;
        max-width: 390px;            
        height: 800px;
        background-color: #ffffff;
        border-radius: 61px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 8px solid #2b2b2b;
        position: relative;
        padding: 24px 20px;
    }
    .reset-header {
        padding: 12px 0;
        display: flex;               /*ทำให้องค์ประกอบในกล่องอยู่ในแถวหรือคอลัมน์เดียวกัน*/   
        justify-content: center;            /*เป็นการทำให้ header อยู่ตรงกลาง*/
        align-items: center;        /*จัดของข้างในให้อยู่ตรงกลาง*/
    }
    .dynamic-island {
        width: 110px;
        height: 28px;
        background-color: #000000 ;
        border-radius: 20px;

        position: absolute; /*อิงตำแหน่งจากapp-container*/ 
        top : 30px ;          /* ระยะห่างจากขอบจอ */
        left: 50%;              /* ขยับมาเริ่มที่จุดกึ่งกลางของหน้าจอ */
        transform: translateX(-50%);     /* ดึงตัวแถบกลับมาทางซ้าย 50% เพื่อให้อยู่ตรงกลาง */   
    }
    /* กล่องหลักหน้าแอพ */
    .reset-content {
        padding:80px 24px 30px ;
        display: flex;
        flex-direction: column;         /*จัดเรียงบนลงล่าง*/
        align-items: center; 
        flex: 1;
    }
    .reset-icon {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1.5px solid #f06529;
        color: #f06529;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 12px auto;
        font-size: 18px;
        transform: translateY(-400px);
    }
    h1{
        font-size: 28px;
        font-weight: 650;
        color: #111111;
        margin-bottom: 10px;
        align-self: center;         /*ใช้กับตัวใดตัวนึง*/
        position: absolute;
        top: 170px;
    }
    /* อธิบายใต้หลังข้อหลัก */
    .reset-subtitle{
        font-size: 12px;
        color: #666666;
        line-height: 1.4;
        margin-bottom: 20px;
        align-self: center;
        transform: translateY(-320px);
    }
    /*ช่องกรอกกลุ่มข้อมูล  */
    .form-group {
        text-align: left;
        margin-bottom: 16px;
        transform: translateY(-310px);

    }   
    /* ข้อความหัวกำหับช่องกรอก*/
    .form-group label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #444444;
        margin-bottom: 6px;
    }
    /* input */
    .form-group input {
        width: 100%;
        padding: 10px 12px;
        font-size: 13px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        outline: none;
        color: #333333;
        background-color: #ffffff;
    }
    .form-group input:focus {
        border-color: #f06529;
    }
    .submit-btn  {
        width: 100%;
        padding: 12px;
        background-color: #f26522;
        color: white;
        border: none;
        border-radius: 14px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transform: translateY(-290px);       /* ย้ายตำแหน่งโดยไม่มีผลกระทบต่อส่วนอื่น ค่าน้อยยิ่งสูง*/
    }
    .submit-btn:hover {
        background-color: #e05413;
    }
    .back-to-login {
        margin-top: 19px;
        text-align: center;
        transform: translateY(-280px);
    }
    /* ลิงค์ย้อนกลับ */
    .back-to-login a {
        color: #f06529;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        
        
    }
    .back-to-login a:hover {
        text-decoration: underline;
    }






</style>
</head>


<body>
    <div class="reset-container">
            <div class="dynamic-island"></div>
            <div class="reset-content"></div>
            <div class="reset-icon">
                <i class="fa-solid fa-arrow-rotate-left"></i>
            </div>
        <h1>ขอรีเซ็ทรหัสผ่าน</h1>
        <p class="reset-subtitle">ป้อนรหัสผ่านของคุณเพื่อรับลิงก์รีเซ็ตรหัสผ่าน</p>  

        <div class="form-group">
            <label>รหัสนักศึกษา</label>
            <input type="text" placeholder="เช่น 640599">
        </div>

        <button type="button" class="submit-btn" onclick="window.location.href='Verify.html'">ยืนยันเพื่อส่งอีเมล</button>

        <div class="back-to-login">
            <a href="login.html">กลับไปหน้าเข้าสู่ระบบ</a>
        </div>
        </div>

    </div>
    <script>
    // ดึงองค์ประกอบฟอร์มมาจากหน้าเว็บ
        const form = document.getElementById('forgot-password-form');
        const studentIdInput = document.getElementById('student-id-input');

        // เมื่อผู้ใช้กดปุ่มส่งฟอร์ม (Submit)
        form.addEventListener('submit', function(event) {
            event.preventDefault(); // ป้องกันไม่ให้หน้าเว็บรีเฟรชตามค่าเริ่มต้น

            const studentId = studentIdInput.value.trim(); // ดึงค่าที่ผู้ใช้พิมพ์ ตัดช่องว่างออก

            if (studentId) {
                // บันทึกรหัสนักศึกษาลงใน sessionStorage ชื่อ 'resetStudentId'
                sessionStorage.setItem('resetStudentId', studentId);

                // เปลี่ยนหน้าไปยังหน้ายืนยัน 
                window.location.href = 'Verify.html';
            }
        });
    </script>


    
</body>
</html>
