<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lost & Found</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* เซ็ตระยะขอบเดิมและการตั้งค่าพื้นฐาน */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }
        :root {
            --primary: #f26522;
            --primary-hover: #e05413;
            --text: #111111;
            --text-label: #444444;
            --text-muted: #666666;
            --border: #e0e0e0;
            --error: #d93025;
            --error-bg: #fdecea;
        }
        body {
            background-color: #f4f5f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* กรอบจำลองหน้าจอมือถือ */
        .reset-container {
            width: 100%;
            max-width: 390px;
            height: 800px;
            background-color: #ffffff;
            border-radius: 61px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            border: 8px solid #2b2b2b;
            position: relative;
        }
        .dynamic-island {
            width: 110px;
            height: 28px;
            background-color: #000000;
            border-radius: 20px;
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
        }
        /* กล่องหลักหน้าแอป */
        .reset-content {
            height: 100%;
            overflow-y: auto;
            scrollbar-width: none;
            padding: 104px 20px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .reset-content::-webkit-scrollbar { display: none; }

        .reset-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1.5px solid var(--primary);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            font-weight: 650;
            color: var(--text);
            margin-bottom: 10px;
            text-align: center;
        }
        .reset-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            text-align: center;
            margin-bottom: 28px;
            padding: 0 8px;
        }
        .reset-form {
            width: 100%;
        }
        /* แจ้งเตือนด้านบนฟอร์ม */
        .form-alert {
            display: none;
            align-items: flex-start;
            gap: 8px;
            background-color: var(--error-bg);
            color: var(--error);
            font-size: 12.5px;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 14px;
            line-height: 1.45;
        }
        .form-alert.is-visible { display: flex; }
        .form-alert i { margin-top: 2px; }

        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-label);
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            border: 1px solid var(--border);
            border-radius: 13px;
            outline: none;
            color: #333333;
            background-color: #ffffff;
            transition: border-color 0.15s;
        }
        .form-group input::placeholder { color: #9a9a9a; }
        .form-group input:focus {
            border-color: var(--primary);
        }
        .form-group input.is-invalid {
            border-color: var(--error);
        }
        .field-error {
            font-size: 11.5px;
            color: var(--error);
            margin-top: 5px;
            line-height: 1.4;
        }
        .field-error:empty { display: none; }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .submit-btn:hover { background-color: var(--primary-hover); }
        .submit-btn:disabled {
            opacity: 0.7;
            cursor: wait;
        }
        .back-to-login {
            margin-top: 20px;
            text-align: center;
        }
        .back-to-login a {
            color: var(--primary);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }
        .back-to-login a:hover { text-decoration: underline; }

        /* เปิดบนมือถือจริง: แสดงเต็มจอ ไม่ต้องมีกรอบ */
        @media (max-width: 430px) {
            .reset-container {
                max-width: none;
                height: 100vh;
                height: 100dvh;
                border: none;
                border-radius: 0;
                box-shadow: none;
            }
            .dynamic-island { display: none; }
            .reset-content { padding-top: 64px; }
        }
    </style>
</head>

<body>
    <div class="reset-container">
        <div class="dynamic-island"></div>

        <div class="reset-content">
            <div class="reset-icon">
                <i class="fa-solid fa-arrow-rotate-left"></i>
            </div>
            <h1>ขอรีเซ็ตรหัสผ่าน</h1>
            <p class="reset-subtitle">กรอกรหัสนักศึกษาของคุณ เพื่อรับรหัส OTP สำหรับตั้งรหัสผ่านใหม่</p>

            <form class="reset-form" id="reset-form" novalidate>
                <div class="form-alert" id="form-alert" role="alert">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="form-alert-text"></span>
                </div>

                <div class="form-group">
                    <label for="Student_ID">รหัสนักศึกษา</label>
                    <input type="text" id="Student_ID" name="Student_ID" placeholder="เช่น 6xxxxxxx" inputmode="numeric" autocomplete="username" maxlength="8" aria-describedby="Student_ID-error">
                    <div class="field-error" id="Student_ID-error" aria-live="polite"></div>
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">ยืนยันรหัสนักศึกษา</button>

                <div class="back-to-login">
                    <a href="login.html">กลับไปหน้าเข้าสู่ระบบ</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ที่อยู่ของ Backend (ตรงกับ PORT ในไฟล์ Backend/.env)
        const API_BASE_URL = 'http://localhost:5001';
        // key ใน sessionStorage ที่ใช้ส่งข้อมูลระหว่างหน้า resetpass → Verify → newpass
        const RESET_FLOW_KEY = 'resetPasswordFlow';
        const STUDENT_ID_PATTERN = /^\d{8}$/;
        const SUBMIT_LABEL = 'ยืนยันรหัสนักศึกษา';

        const form = document.getElementById('reset-form');
        const input = document.getElementById('Student_ID');
        const submitBtn = document.getElementById('submit-btn');
        const formAlert = document.getElementById('form-alert');
        const formAlertText = document.getElementById('form-alert-text');
        let submitAttempted = false;

        function readFlow() {
            try { return JSON.parse(sessionStorage.getItem(RESET_FLOW_KEY)) || null; } catch { return null; }
        }

        function saveFlow(flow) {
            try { sessionStorage.setItem(RESET_FLOW_KEY, JSON.stringify(flow)); } catch { /* ใช้งานต่อได้แม้บันทึกไม่ได้ */ }
        }

        function validateStudentId(value) {
            if (!value) return 'กรุณากรอกรหัสนักศึกษา';
            if (!STUDENT_ID_PATTERN.test(value)) return 'รหัสนักศึกษาต้องเป็นตัวเลข 8 หลัก';
            return '';
        }

        function setFieldError(message) {
            document.getElementById('Student_ID-error').textContent = message || '';
            input.classList.toggle('is-invalid', Boolean(message));
            input.setAttribute('aria-invalid', message ? 'true' : 'false');
        }

        function showFormAlert(message) {
            formAlertText.textContent = message || '';
            formAlert.classList.toggle('is-visible', Boolean(message));
        }

        function setLoading(isLoading) {
            submitBtn.disabled = isLoading;
            submitBtn.innerHTML = isLoading
                ? '<i class="fa-solid fa-spinner fa-spin"></i> กำลังตรวจสอบ...'
                : SUBMIT_LABEL;
        }

        // รับเฉพาะตัวเลข สูงสุด 8 หลัก
        input.addEventListener('input', () => {
            const digitsOnly = input.value.replace(/\D/g, '').slice(0, 8);
            if (input.value !== digitsOnly) input.value = digitsOnly;
            showFormAlert('');
            if (submitAttempted) setFieldError(validateStudentId(digitsOnly));
        });

        // มาจากหน้า Login (ลิงก์ "ลืมรหัสผ่าน?" ส่ง ?sid=รหัสนักศึกษา มา): เติมรหัสให้
        const sidFromUrl = (new URLSearchParams(window.location.search).get('sid') || '').replace(/\D/g, '').slice(0, 8);
        if (sidFromUrl) input.value = sidFromUrl;

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            submitAttempted = true;
            showFormAlert('');

            const studentId = input.value.trim();
            const error = validateStudentId(studentId);
            setFieldError(error);
            if (error) {
                input.focus();
                return;
            }

            setLoading(true);
            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/request-reset`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Student_ID: studentId }),
                });
                const data = await response.json().catch(() => ({}));

                if (response.ok && data.success) {
                    const now = Date.now();
                    saveFlow({
                        Student_ID: studentId,
                        email: data.email,
                        otp: data.otp || null,                                   // รหัส OTP ที่จะเด้งเป็น Notification ในหน้า Verify
                        expiresAt: now + (data.expiresInSeconds || 600) * 1000,  // เวลาหมดอายุของ OTP
                        resendAt: now + (data.resendAfterSeconds || 60) * 1000,  // เวลาที่ขอ OTP ใหม่ได้
                        showNotification: true,
                        verified: false,
                    });
                    window.location.href = 'Verify.html';
                    return;
                }

                // เพิ่งขอ OTP ไปแล้ว และรหัสเดิมยังใช้ได้: กลับไปหน้า Verify เลย
                const existing = readFlow();
                if (response.status === 429 && existing && existing.Student_ID === studentId && existing.expiresAt > Date.now()) {
                    existing.showNotification = true;
                    saveFlow(existing);
                    window.location.href = 'Verify.html';
                    return;
                }

                if (data.errors && data.errors.Student_ID) setFieldError(data.errors.Student_ID);
                else showFormAlert(data.message || 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
                setLoading(false);
                input.focus();
            } catch (error) {
                showFormAlert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาตรวจสอบว่าเปิด Backend แล้ว และลองใหม่อีกครั้ง');
                setLoading(false);
            }
        });
    </script>
</body>
</html>
