<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lost & Found</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ล้างค่าขอบทั้งในและนอก ที่เบราว์เซอร์ให้มา */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }
        :root {
            --primary: #f26522;
            --primary-hover: #e05413;
            --text: #111111;
            --text-label: #444444;
            --text-muted: #666666;
            --border: #e0e0e0;
            --success: #1f9d55;
            --success-bg: #e8f6ee;
            --error: #d93025;
            --error-bg: #fdecea;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        /* พื้นหลังหน้าเว็บ */
        body {
            background-color: #f4f5f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* กรอบจำลองหน้าจอมือถือ */
        .app-container {
            width: 100%;
            max-width: 390px;
            height: 800px;
            background-color: #ffffff;
            border-radius: 61px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            border: 8px solid #2b2b2b;
            position: relative;
        }
        .dynamic-island {
            width: 110px;
            height: 28px;
            background-color: #000000;
            border-radius: 20px;
            position: absolute;              /* อิงตำแหน่งจาก app-container */
            top: 30px;
            left: 50%;
            transform: translateX(-50%);     /* จัดให้อยู่กึ่งกลาง */
            z-index: 2;
        }
        /* เนื้อหาหลัก เลื่อนขึ้นลงได้ถ้าข้อความแจ้งเตือนทำให้ยาวเกินจอ */
        .app-content {
            height: 100%;
            overflow-y: auto;
            scrollbar-width: none;
            padding: 66px 20px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-content::-webkit-scrollbar { display: none; }

        .app-logo {
            width: 215px;
            margin-bottom: -6px;
        }
        h1 {
            font-size: 28px;
            font-weight: 650;
            color: var(--text);
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
            text-align: center;
        }
        .login-form {
            width: 100%;
        }

        /* แจ้งเตือนด้านบนฟอร์ม (สมัครสำเร็จ / รหัสผิด / เชื่อมต่อไม่ได้) */
        .form-alert {
            display: none;
            align-items: flex-start;
            gap: 8px;
            font-size: 12.5px;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 14px;
            line-height: 1.45;
        }
        .form-alert.is-visible { display: flex; }
        .form-alert i { margin-top: 2px; }
        .form-alert.is-error {
            background-color: var(--error-bg);
            color: var(--error);
        }
        .form-alert.is-success {
            background-color: var(--success-bg);
            color: var(--success);
        }

        .form-group {
            width: 100%;
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 13px;
            color: var(--text-label);
            margin-bottom: 6px;
        }
        /* กล่องช่องกรอก (มีไอคอนด้านหน้า) */
        .input-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 0 14px;
            height: 45px;
            background-color: #ffffff;
            transition: border-color 0.2s;
        }
        .input-wrapper:focus-within {
            border-color: var(--primary);
        }
        .input-wrapper.is-invalid {
            border-color: var(--error);
        }
        .input-wrapper > i {
            color: #888888;
            font-size: 16px;
            margin-right: 10px;
        }
        .input-wrapper input {
            border: none;
            outline: none;
            width: 100%;
            min-width: 0;
            font-size: 14px;
            color: #333333;
            background: transparent;
        }
        .input-wrapper input::placeholder { color: #9a9a9a; }
        .toggle-password {
            border: none;
            background: none;
            color: #888888;
            font-size: 16px;
            margin-left: 10px;
            padding: 6px;
            margin-right: -6px;
            cursor: pointer;
            border-radius: 8px;
        }
        .toggle-password:focus-visible {
            outline: 2px solid var(--primary);
        }
        .field-error {
            font-size: 11.5px;
            color: var(--error);
            margin-top: 5px;
            line-height: 1.4;
        }
        .field-error:empty { display: none; }

        /* ลืมรหัสผ่าน */
        .forgot-password-container {
            width: 100%;
            text-align: right;
            margin-top: 4px;
            margin-bottom: 24px;
        }
        .forgot-password {
            color: var(--primary);
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
        }

        /* ปุ่มเข้าสู่ระบบ */
        .button-submit {
            width: 100%;
            height: 50px;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(242, 101, 34, 0.3);
            transition: background-color 0.2s;
        }
        .button-submit:hover {
            background-color: var(--primary-hover);
        }
        .button-submit:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        /* ส่วนของคนที่ยังไม่มีบัญชี */
        .register-link {
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
        }
        .register-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        /* เปิดบนมือถือจริง: แสดงเต็มจอ ไม่ต้องมีกรอบ */
        @media (max-width: 430px) {
            .app-container {
                max-width: none;
                height: 100vh;
                height: 100dvh;
                border: none;
                border-radius: 0;
                box-shadow: none;
            }
            .dynamic-island { display: none; }
            .app-content { padding-top: 32px; }
        }
    </style>
</head>

<body>
    <!-- แสดงตัวเครื่องมือถือ -->
    <div class="app-container">
        <div class="dynamic-island"></div>

        <div class="app-content">
            <img src="logo.png" class="app-logo" alt="Campus Finder Lost & Found">

            <h1>Welcome Back</h1>
            <p class="subtitle">กรุณาเข้าสู่ระบบ</p>

            <form class="login-form" id="login-form" novalidate>
                <div class="form-alert" id="form-alert" role="alert">
                    <i class="fa-solid fa-circle-exclamation" id="form-alert-icon"></i>
                    <span id="form-alert-text"></span>
                </div>

                <!-- ช่องกรอกรหัสนักศึกษา -->
                <div class="form-group">
                    <label class="form-label" for="Student_ID">รหัสนักศึกษา</label>
                    <div class="input-wrapper" id="Student_ID-wrapper">
                        <i class="fa-regular fa-address-card"></i>
                        <input type="text" id="Student_ID" name="Student_ID" placeholder="เช่น 6xxxxxxx" inputmode="numeric" autocomplete="username" maxlength="8" aria-describedby="Student_ID-error">
                    </div>
                    <div class="field-error" id="Student_ID-error" aria-live="polite"></div>
                </div>

                <!-- ช่องกรอกรหัสผ่าน -->
                <div class="form-group">
                    <label class="form-label" for="Password">รหัสผ่าน</label>
                    <div class="input-wrapper" id="Password-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="Password" name="Password" placeholder="••••••••" autocomplete="current-password" aria-describedby="Password-error">
                        <button type="button" class="toggle-password" id="toggle-password" aria-label="แสดงรหัสผ่าน">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <div class="field-error" id="Password-error" aria-live="polite"></div>
                </div>

                <!-- ลิงก์ลืมรหัสผ่าน -->
                <div class="forgot-password-container">
                    <a href="resetpass.html" class="forgot-password">ลืมรหัสผ่าน?</a>
                </div>

                <!-- ปุ่มเข้าสู่ระบบ -->
                <button type="submit" class="button-submit" id="submit-btn">login</button>

                <!-- ไปหน้าสมัครสมาชิก ถ้ายังไม่มีบัญชี -->
                <div class="register-link">
                    ยังไม่มีบัญชี? <a href="register.html">ลงทะเบียน</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ที่อยู่ของ Backend (ตรงกับ PORT ในไฟล์ Backend/.env)
        const API_BASE_URL = 'http://localhost:5001';
        // หน้าที่จะไปหลังเข้าสู่ระบบสำเร็จ (เปลี่ยนเป็นหน้าหลักของแอป)
        const HOME_PAGE = 'home.html';
        // key ที่ใช้เก็บข้อมูลผู้ใช้ที่ล็อกอินอยู่ใน localStorage (หน้าอื่นอ่านจาก key นี้เพื่อเอา User_ID)
        const CURRENT_USER_KEY = 'currentUser';

        const STUDENT_ID_PATTERN = /^\d{8}$/;
        const SUBMIT_LABEL = 'login';

        const form = document.getElementById('login-form');
        const submitBtn = document.getElementById('submit-btn');
        const formAlert = document.getElementById('form-alert');
        const formAlertIcon = document.getElementById('form-alert-icon');
        const formAlertText = document.getElementById('form-alert-text');
        const fields = {
            Student_ID: document.getElementById('Student_ID'),
            Password: document.getElementById('Password'),
        };

        let submitAttempted = false;
        const touched = new Set();

        function getValues() {
            return {
                Student_ID: fields.Student_ID.value.trim(),
                Password: fields.Password.value,
            };
        }

        function validate(values) {
            const errors = { Student_ID: '', Password: '' };
            if (!values.Student_ID) errors.Student_ID = 'กรุณากรอกรหัสนักศึกษา';
            else if (!STUDENT_ID_PATTERN.test(values.Student_ID)) errors.Student_ID = 'รหัสนักศึกษาต้องเป็นตัวเลข 8 หลัก';
            if (!values.Password) errors.Password = 'กรุณากรอกรหัสผ่าน';
            return errors;
        }

        function setFieldError(name, message) {
            document.getElementById(`${name}-error`).textContent = message || '';
            document.getElementById(`${name}-wrapper`).classList.toggle('is-invalid', Boolean(message));
            fields[name].setAttribute('aria-invalid', message ? 'true' : 'false');
        }

        // แสดง error เฉพาะช่องที่ผู้ใช้กรอกแล้ว หรือหลังจากกดเข้าสู่ระบบ
        function renderErrors() {
            const errors = validate(getValues());
            for (const name of Object.keys(fields)) {
                setFieldError(name, submitAttempted || touched.has(name) ? errors[name] : '');
            }
            return errors;
        }

        function showFormAlert(message, type = 'error') {
            formAlertText.textContent = message || '';
            formAlert.classList.toggle('is-visible', Boolean(message));
            formAlert.classList.toggle('is-error', type === 'error');
            formAlert.classList.toggle('is-success', type === 'success');
            formAlertIcon.className = type === 'success' ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-exclamation';
        }

        // รหัสนักศึกษา: รับเฉพาะตัวเลข สูงสุด 8 หลัก
        fields.Student_ID.addEventListener('input', () => {
            const digitsOnly = fields.Student_ID.value.replace(/\D/g, '').slice(0, 8);
            if (fields.Student_ID.value !== digitsOnly) fields.Student_ID.value = digitsOnly;
        });

        for (const [name, input] of Object.entries(fields)) {
            input.addEventListener('blur', () => {
                if (input.value.trim() !== '') touched.add(name);
                renderErrors();
            });
            input.addEventListener('input', () => {
                if (formAlert.classList.contains('is-error')) showFormAlert('');
                renderErrors();
            });
        }

        // ปุ่มรูปตา แสดง/ซ่อนรหัสผ่าน
        document.getElementById('toggle-password').addEventListener('click', (event) => {
            const button = event.currentTarget;
            const isHidden = fields.Password.type === 'password';
            fields.Password.type = isHidden ? 'text' : 'password';
            button.querySelector('i').className = isHidden ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
            button.setAttribute('aria-label', isHidden ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน');
        });

        function setLoading(isLoading) {
            submitBtn.disabled = isLoading;
            submitBtn.innerHTML = isLoading
                ? '<i class="fa-solid fa-spinner fa-spin"></i> กำลังเข้าสู่ระบบ...'
                : SUBMIT_LABEL;
        }

        // มาจากหน้าสมัครสมาชิก (?registered=1&sid=...) หรือหน้าตั้งรหัสผ่านใหม่ (?reset=1&sid=...):
        // เติมรหัสนักศึกษาให้ และแจ้งว่าทำรายการสำเร็จ
        const params = new URLSearchParams(window.location.search);
        const successMessages = {
            registered: 'สมัครใช้งานสำเร็จ กรุณาเข้าสู่ระบบด้วยรหัสผ่านที่ตั้งไว้',
            reset: 'เปลี่ยนรหัสผ่านสำเร็จ กรุณาเข้าสู่ระบบด้วยรหัสผ่านใหม่',
        };
        const successKey = Object.keys(successMessages).find((key) => params.get(key) === '1');
        if (successKey) {
            const sid = (params.get('sid') || '').replace(/\D/g, '').slice(0, 8);
            if (sid) fields.Student_ID.value = sid;
            showFormAlert(successMessages[successKey], 'success');
            (sid ? fields.Password : fields.Student_ID).focus();
            history.replaceState(null, '', window.location.pathname);
        }

        // ลิงก์ "ลืมรหัสผ่าน?": ถ้ากรอกรหัสนักศึกษาไว้แล้ว ส่งไปเติมให้ในหน้าขอรีเซ็ตรหัสผ่าน
        document.querySelector('.forgot-password').addEventListener('click', (event) => {
            const sid = fields.Student_ID.value.trim();
            if (STUDENT_ID_PATTERN.test(sid)) {
                event.preventDefault();
                window.location.href = `resetpass.html?sid=${encodeURIComponent(sid)}`;
            }
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            submitAttempted = true;
            showFormAlert('');

            const errors = renderErrors();
            const firstInvalid = Object.keys(fields).find((name) => errors[name]);
            if (firstInvalid) {
                fields[firstInvalid].focus();
                return;
            }

            setLoading(true);
            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(getValues()),
                });
                const data = await response.json().catch(() => ({}));

                if (response.ok && data.success && data.user) {
                    // เก็บข้อมูลผู้ใช้ไว้ให้หน้าอื่นใช้ (เช่น User_ID ตอนแจ้งของหาย)
                    try {
                        localStorage.setItem(CURRENT_USER_KEY, JSON.stringify({ role: data.role, ...data.user }));
                    } catch (storageError) {
                        console.warn('ไม่สามารถบันทึกข้อมูลผู้ใช้ลง localStorage ได้', storageError);
                    }
                    window.location.href = HOME_PAGE;
                    return;
                }

                // แสดง error ที่ Backend ส่งกลับมา
                const serverErrors = data.errors || {};
                for (const [name, message] of Object.entries(serverErrors)) {
                    if (fields[name]) setFieldError(name, message);
                }
                if (!Object.keys(serverErrors).some((name) => fields[name])) {
                    showFormAlert(data.message || 'เกิดข้อผิดพลาดในการเข้าสู่ระบบ กรุณาลองใหม่อีกครั้ง');
                }
                setLoading(false);
                if (response.status === 401) {
                    fields.Password.focus();
                    fields.Password.select();
                }
            } catch (error) {
                showFormAlert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาตรวจสอบว่าเปิด Backend แล้ว และลองใหม่อีกครั้ง');
                setLoading(false);
            }
        });
    </script>
</body>
</html>
