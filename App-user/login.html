<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lost & Found</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" 
            rel="stylesheet"> 

    <style> 
            /*ล้างค่าขอบทั้งในและนอก ที่เบราเซอร์ให้มา*/
        *{
            margin: 0;                  /*ลบระยะห่างภายนอก*/
            padding: 0;                  /* ลบกระยะห่างภายใน */
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }
        
        img {
            max-width: 100%;
            height: auto;
        }
        /* พื้นหลังหน้าเว็บสำหรับวางเครื่องมือ */
        body {
            background-color: #f4f5f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* กำหนดตัวขนาดเครื่อง */
        .app-container {
            width: 100%;
            max-width: 390px;
            height: 800px;
            background-color: #ffffff;
            border-radius: 61px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 8px solid #2b2b2b;
            position: relative;
            padding: 24px 20px;
        }
        /* กำหนด ส่วนheader */
        .app-header {
            padding: 12px 0;
            display: flex;               /*ทำให้องค์ประกอบในกล่องอยู่ในแถวหรือคอลัมน์เดียวกัน*/   
            justify-content: center;            /*เป็นการทำให้ header อยู่ตรงกลาง*/
            align-items: center;        /*จัดของข้างในให้อยู่ตรงกลาง*/
        }
            /* สร้าง dynamic */
        .dynamic-island {
            width: 110px;
            height: 28px;
            background-color: #000000 ;
            border-radius: 20px;

            position: absolute; /*อิงตำแหน่งจากapp-container*/ 
            top : 40px ;          /* ระยะห่างจากขอบจอ */
            left: 50%;              /* ขยับมาเริ่มที่จุดกึ่งกลางของหน้าจอ */
            transform: translateX(-50%);     /* ดึงตัวแถบกลับมาทางซ้าย 50% เพื่อให้อยู่ตรงกลาง */   
        }
            /* แสดง เนื้อหาหลักในแอพ */
        .app-content {
            padding:30px 24px ;
            display: flex;
            flex-direction: column;         /*จัดเรียงบนลงล่าง*/
            align-items: center; 
            flex: 1;
            justify-content: flex-start;
        }
            /* ขนาดและตำแหน่งlogo */
        .app-logo {
            width: 215px;
            height: auto;
            margin-bottom: 20px;
            margin-top: 20px;
        }
            /* ข้อความส่วนหัว ต้อนรับ และคำอธิบาย */
        h1 {
            font-size: 28px;
            font-weight: 650;
            color: #111111;
            margin-bottom: 10px;
            align-self: center;         /*ใช้กับตัวใดตัวนึง*/
            position: relative;
            top: -70px;
        }

        .subtitle {
            font-size: 14px;
            color: #666666;
            margin-bottom: 24px;
            text-align: center;
            position: relative;
            top: -70px;
        }
            /* จัดกลุ่ม */
        .form-group {
            width: 100%;
            margin-bottom: 16px; /*ระยะห่างของกล่อง*/
            position: relative;
            top: -75px;
        }

        .form-label {
            display: block; /*กำหนดตัวอักษร เพื่อให้ผลเป็นบล็อคแยกกัน และช่วยดันให้ช่องกรอกข้อมูล ดันไปบรรทัดข้างล่าง*/
            font-size: 13px;
            color: #444444;
            margin-bottom: 6px;
        }
            /* สร้างกล่อง ไว้inputข้อความ */
        .input-wrapper {
            display: flex;                         /* คำสั่งทำให้องค์ประกอบย่อยยืดหยุ่น*/
            align-items: center;
            border: 1px solid #e0e0e0;
            border-radius: 13px;
            padding: 0 14px;
            height: 45px;
            background-color: #ffffff;
            transition: border-color 0.2s;
        }
        .input-wrapper:focus-within {
            border-color: #f26522;
        }
        .input-wrapper i {
            color: #888888;
            font-size: 16px;
            margin-right: 10px;
        }
        .input-wrapper input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 14px;
            color: #333333;
        }
        .input-wrapper .toggle-password {
            margin-right: 0;
            margin-left: 10px;
            cursor: pointer;
        }
            /* ลืมรหัสผ่าน */
        .forgot-password-container {           /*กล่องสำหรับลืมรหัสผ่าน*/
            width: 100%;
            text-align: right;
            margin-top: 4px;
            margin-bottom: 24px;
            position: relative;
            top: -75px;
        }
        .forgot-password {
            color: #f26522;
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
        }
              /* สร้างปุ่มสำหรับเข้าสู่ระบบ */
        .button-submit {
            width: 100%;
            height: 50px;
            background-color: #f26522;
            color: #ffffff;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(242, 101, 34, 0.3);
            transition: background-color 0.2s;
            position: relative;
            top: -75px;
            
        }
              /* สถานะเมื่อเอาเมาส์ไปชี้บนปุ่ม */
        .button-submit:hover {
            background-color: #e05413;        /*สีจะเข้มขึ้นเมื่อเอาเมาส์ไปวางด้านบนปุ่ม*/
        }  
        /* ส่วนของคนที่ไม่มีบัญชีแล้วต้องการ signup */
        .register-link {
            margin-top: 24px;
            font-size: 14px;
            color: #666666;
            position: relative;
            top: -70px;
            align-self: center; 

        }
        .register-link a {
            color: #f26522;
            text-decoration: none;
            font-weight: 600;
        }

    </style>
    
</head>

<body>
     <!-- แสดงตัวเครื่องมือถือ -->
    <div class = "app-container">
        <div class = "dynamic-island"> </div> 
            <div class="app-content">
                <img src="logo.png" class = "app-logo">
            </div>

        <h1> welcome Back</h1>
        <p class = subtitle> เข้าสู่ระบบ</p>

        <div class = "form-group">
            <label class ="form-label">รหัสนักศึกษา</label>
                <div class = " input-wrapper">
                    <i class="fa-regular fa-address-card"></i>
                    <input type="text" placeholder="เช่น 6xxxxxxx">
                </div>
        </div>
            <!-- =แสดงช่องกรอกรหัสผ่าน -->
        <div class="form-group">
            <label class="form-label">รหัสผ่าน</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="••••••••">
                    <i class="fa-regular fa-eye toggle-password"></i>    
                </div>
        </div>
            <!-- ส่วนของลิงค์ลืมรหัส -->
        <div class = " forgot-password-container"> 
                <a href="#" class="forgot-password">ลืมรหัสผ่าน?</a>
        </div>
            <!-- ปุ่มเข้าสู่ระบบ -->
        <button class="button-submit">login</button>  
          <!-- แสดงการsingup ถ้ายังไม่มีบัญชี -->
        <div class="register-link">
                ยังไม่มีบัญชี? <a href="register.html">ลงทะเบียน</a>
        </div>
    </div>



         
         
</body>
</html>
